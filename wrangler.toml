# Cloudflare Workers + Durable Objects 설정. 실행: npm run server:dev, 배포: npm run server:deploy
name = "anime-song-quiz-rooms"
main = "server/index.js"
compatibility_date = "2025-06-01"

[vars]
# 허용할 사이트 주소(쉼표로 구분, 경로 없이 주소만). 배포한 페이지(GitHub Pages)와 로컬 개발용. "*"는 제한 없음
ALLOWED_ORIGINS = "https://astraea2209.github.io,http://localhost:8000,http://127.0.0.1:8000"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

# 무료 플랜은 SQLite 저장 방식(new_sqlite_classes)만 쓸 수 있다
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]
